services:
  mongodb:
    image: mongo:7.0
    container_name: skillbridge-mongodb
    restart: always
    ports:
      - "27019:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - skillbridge-net

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: skillbridge-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/skillbridge
      - JWT_SECRET=skillbridge-academic-jwt-secret-token-key-2026
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - mongodb
    networks:
      - skillbridge-net

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: skillbridge-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - skillbridge-net

volumes:
  mongodb_data:

networks:
  skillbridge-net:
    driver: bridge
